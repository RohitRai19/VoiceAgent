<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with your files</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  // Set the theme before the page paints: saved choice first, otherwise the system setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #1c2129; --muted: #6b7482;
    --accent: #2f6fed; --accent-text: #ffffff; --user: #e8f0fe; --hover: #eef1f5; --danger: #c93a3a;
    --code: #f0f2f5;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #14171d; --border: #262b35; --text: #e6e9ee; --muted: #8f99a8;
    --accent: #5b8dff; --accent-text: #0d1117; --user: #25324a; --hover: #1c2029; --danger: #ef6b6b;
    --code: #1f242d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }

  aside { width: 290px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 8px 12px; }
  .btn:hover { background: var(--hover); }
  .btn.new { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; font-weight: 600; font-size: 15px; background: var(--hover); border-radius: 12px; padding: 12px 14px; }
  .btn.new:hover { border-color: var(--muted); }
  .btn.new svg { width: 18px; height: 18px; flex: none; }
  .status { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--border); background: var(--hover); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
  .status.busy i { background: #f5a524; animation: pulse 1s ease-in-out infinite; }
  .status.offline i { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }
  .icon-btn { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 22px; height: 22px; }
  .section-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 14px 6px; display: flex; justify-content: space-between; align-items: center; }
  .list { overflow-y: auto; padding: 0 8px 8px; }
  #threads { flex: 1 1 55%; min-height: 80px; }
  #files { flex: 0 1 30%; min-height: 60px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--user); }
  .row .label { flex: 1; min-width: 0; }
  .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .x { border: 0; background: none; color: var(--muted); padding: 2px 6px; border-radius: 6px; visibility: hidden; }
  .row:hover .x { visibility: visible; }
  .row .x:hover { color: var(--danger); background: var(--panel); }
  .row .more { font-size: 18px; line-height: 1; letter-spacing: 1px; }
  .row .more:hover { color: var(--text); background: var(--panel); }
  .row.active .more, .row.menu-on .more { visibility: visible; }
  @media (hover: none) { .row .x { visibility: visible; } }
  .row .pin { flex: none; color: var(--muted); display: inline-flex; }
  .row input.rename { width: 100%; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; outline: 0; }
  .menu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px; min-width: 180px; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
  .menu button { display: flex; gap: 12px; align-items: center; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 8px; text-align: left; }
  .menu button:hover { background: var(--hover); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 0; }
  .menu .danger { color: var(--danger); }
  .menu svg, .copy svg, .pin svg { width: 16px; height: 16px; flex: none; }
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
  .dialog { width: min(450px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px 22px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
  .dialog h3 { margin: 0 0 8px; font-size: 18px; }
  .dialog p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .dialog .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  .dialog button { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 9px 18px; font-weight: 600; }
  .dialog button:hover { border-color: var(--muted); }
  .dialog button.danger-btn { background: #ef5350; border-color: #ef5350; color: #fff; }
  .dialog button.danger-btn:hover { filter: brightness(1.08); }
  .confirm-box { margin-top: 10px; border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; background: var(--panel); }
  .confirm-box.done { opacity: .6; }
  .confirm-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .confirm-summary { overflow-wrap: anywhere; }
  .confirm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .confirm-actions button { border-radius: 8px; padding: 6px 16px; font-weight: 600; border: 1px solid var(--border); background: var(--hover); }
  .confirm-actions .confirm-yes { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .confirm-actions button:disabled { opacity: .5; cursor: default; }
  .guard-note { color: var(--danger); }
  .file-row { cursor: default; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 8px; }
  #drop { margin: 0 14px 14px; border: 1.5px dashed var(--border); border-radius: 10px; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #upload-status { font-size: 12px; color: var(--muted); padding: 0 14px 10px; white-space: pre-wrap; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #menu { display: none; }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill.ok { color: #1f9d55; border-color: #1f9d55; }
  .pill.warn { color: #c98a1a; border-color: #c98a1a; }

  #messages { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin: 0 0 18px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.assistant { flex-direction: row; gap: 12px; align-items: flex-start; }
  .avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; background: #10b981; color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .body { flex: 1; min-width: 0; padding-top: 5px; }
  .thinking { display: flex; align-items: center; gap: 12px; height: 24px; }
  .dots { display: inline-flex; gap: 5px; align-items: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-5px); opacity: 1; } }
  .elapsed { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  .copy { font-size: 13px; border: 1px solid var(--border); background: var(--hover); border-radius: 8px; padding: 4px 10px; display: inline-flex; gap: 7px; align-items: center; }
  .copy:hover { border-color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }
  .bubble { max-width: 100%; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant .bubble > :first-child { margin-top: 0; }
  .msg.assistant .bubble > :last-child { margin-bottom: 0; }
  .bubble pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .bubble code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre code { padding: 0; background: none; }
  .bubble table { border-collapse: collapse; display: block; overflow-x: auto; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  details.sources { margin-top: 8px; font-size: 13px; }
  details.sources summary { cursor: pointer; color: var(--muted); }
  .src { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; background: var(--panel); }
  .src b { font-weight: 600; }
  .src .snip { color: var(--muted); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error { color: var(--danger); }
  .welcome { text-align: center; color: var(--muted); margin-top: 12vh; }
  .welcome h2 { color: var(--text); margin-bottom: 6px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }

  form { padding: 12px 20px 18px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; padding: 6px 8px; max-height: 180px; }
  #send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 600; }
  #send:disabled { opacity: .5; cursor: default; }
  #mic.recording { color: #fff; background: #ef5350; animation: pulse 1.1s ease-in-out infinite; }
  #mic:disabled { opacity: .5; cursor: default; }
  .icon-btn.small { width: 22px; margin-right: -6px; }
  .icon-btn.small svg { width: 16px; height: 16px; }
  .menu .check { width: 16px; flex: none; text-align: center; }
  .menu .menu-label { padding: 6px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 760px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.3); }
    body.menu-open aside { transform: none; }
    #menu { display: inline-block; }
    header, #messages, form { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside>
  <div class="side-head"><button class="btn new" id="new-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button></div>
  <div class="section-title">Chats</div>
  <div class="list" id="threads"></div>
  <div class="section-title">Your files <span id="file-count"></span></div>
  <div class="list" id="files"></div>
  <div id="upload-status"></div>
  <div id="drop">Drop files here or click to upload<br><small>PDF, DOCX, TXT, MD, CSV, JSON…</small></div>
  <input type="file" id="file-input" multiple hidden>
</aside>

<main>
  <header>
    <button class="btn" id="menu" aria-label="Open menu">☰</button>
    <h1 id="title">New chat</h1>
    <span class="status" id="status" role="status"><i></i><span id="status-text">Ready</span></span>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch between dark and light theme" title="Switch theme"></button>
  </header>
  <div id="messages"><div class="wrap" id="msg-wrap"></div></div>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask something about your files…" autofocus></textarea>
      <button id="mic-device" class="icon-btn small" type="button" aria-label="Choose microphone" title="Choose microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button id="mic" class="icon-btn" type="button" aria-label="Speak your question" title="Speak your question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { threadId: null, busy: false };

function md(text) {
  text = text.replace(/【(\d+)[^】]*】/g, "[$1]");
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  const d = document.createElement("div"); d.textContent = text;
  return d.innerHTML.replace(/\n/g, "<br>");
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return r.json();
}
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

/* ---------- threads ---------- */
async function loadThreads() {
  const threads = await api("/api/threads");
  const box = $("threads"); box.replaceChildren();
  if (!threads.length) box.append(el("div", "empty", "No chats yet."));
  for (const t of threads) {
    const row = el("div", "row" + (t.thread_id === state.threadId ? " active" : ""));
    const label = el("div", "label");
    label.append(el("div", "title", t.title), el("div", "sub", `${t.message_count} messages · ${t.total_tokens.toLocaleString()} tokens`));
    if (t.pinned) { const p = el("span", "pin"); p.innerHTML = ICONS.pin; p.title = "Pinned"; row.append(p); }
    const more = el("button", "x more", "⋯"); more.title = "Chat options"; more.setAttribute("aria-label", "Chat options");
    more.onclick = (e) => {
      e.stopPropagation();
      openMenu(more, row, [
        { label: "Rename", icon: ICONS.rename, run: () => startRename(row, t) },
        { label: t.pinned ? "Unpin" : "Pin", icon: ICONS.pin, run: async () => {
            await api("/api/threads/" + t.thread_id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pinned: !t.pinned }) });
            loadThreads();
        } },
        null,
        { label: "Delete", icon: ICONS.trash, danger: true, run: async () => {
            if (!(await confirmDialog({ title: "Delete chat?", text: `"${shorten(t.title)}" will be removed with all its messages. This cannot be undone.` }))) return;
            await api("/api/threads/" + t.thread_id, { method: "DELETE" });
            if (t.thread_id === state.threadId) newChat(); else loadThreads();
        } },
      ]);
    };
    row.append(label, more);
    row.onclick = () => openThread(t.thread_id);
    box.append(row);
  }
}
function startRename(row, t) {
  const input = document.createElement("input");
  input.className = "rename"; input.value = t.title; input.maxLength = 80;
  row.querySelector(".title").replaceWith(input);
  input.onclick = (e) => e.stopPropagation();
  input.focus(); input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const title = input.value.trim();
    if (save && title && title !== t.title) {
      try {
        await api("/api/threads/" + t.thread_id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
        if (t.thread_id === state.threadId) $("title").textContent = title;
      } catch (e) { await confirmDialog({ title: "Could not rename", text: e.message, confirmLabel: "OK", cancelLabel: null, danger: false }); }
    }
    loadThreads();
  };
  input.onkeydown = (e) => { if (e.key === "Enter") finish(true); else if (e.key === "Escape") finish(false); };
  input.onblur = () => finish(true);
}

/* ---------- confirm dialog (replaces the browser's confirm/alert boxes) ---------- */
function shorten(text, max = 34) { return text.length > max ? text.slice(0, max).trimEnd() + "..." : text; }
function confirmDialog({ title, text, confirmLabel = "Delete", cancelLabel = "Cancel", danger = true }) {
  return new Promise((resolve) => {
    const previous = document.activeElement;
    const overlay = el("div", "overlay");
    const box = el("div", "dialog");
    box.setAttribute("role", "alertdialog"); box.setAttribute("aria-modal", "true");
    const actions = el("div", "dlg-actions");
    const ok = el("button", danger ? "danger-btn" : null, confirmLabel); ok.type = "button";
    const cancel = cancelLabel ? el("button", null, cancelLabel) : null;
    if (cancel) { cancel.type = "button"; actions.append(cancel); }
    actions.append(ok);
    box.append(el("h3", null, title), el("p", null, text), actions);
    overlay.append(box);
    document.body.append(overlay);
    const close = (result) => {
      overlay.remove();
      document.removeEventListener("keydown", onKey, true);
      previous?.focus?.();
      resolve(result);
    };
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); close(false); }
      else if (e.key === "Tab" && cancel) { e.preventDefault(); (document.activeElement === ok ? cancel : ok).focus(); }
    };
    document.addEventListener("keydown", onKey, true);
    overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(false); });
    ok.onclick = () => close(true);
    if (cancel) cancel.onclick = () => close(false);
    (cancel || ok).focus();  // Cancel is focused first, so Enter never deletes by accident
  });
}

/* ---------- popup menu ---------- */
const ICONS = {
  rename: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 4H7l3-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
};
let closeMenu = () => {};
function openMenu(anchor, row, items) {
  closeMenu();
  const menu = el("div", "menu"); menu.setAttribute("role", "menu");
  for (const it of items) {
    if (!it) { menu.append(document.createElement("hr")); continue; }
    const b = el("button", it.danger ? "danger" : null); b.setAttribute("role", "menuitem");
    b.innerHTML = it.icon; b.append(el("span", null, it.label));
    b.onclick = (e) => { e.stopPropagation(); closeMenu(); it.run(); };
    menu.append(b);
  }
  document.body.append(menu);
  row.classList.add("menu-on");
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
  menu.style.top = (r.bottom + 6 + menu.offsetHeight > innerHeight ? r.top - menu.offsetHeight - 6 : r.bottom + 6) + "px";
  const onDown = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  const onKey = (e) => { if (e.key === "Escape") closeMenu(); };
  closeMenu = () => {
    menu.remove(); row.classList.remove("menu-on");
    document.removeEventListener("mousedown", onDown, true); document.removeEventListener("keydown", onKey);
    $("threads").removeEventListener("scroll", closeMenu);
    closeMenu = () => {};
  };

/* ---------- spoken replies (live) ----------
   The answer is spoken sentence by sentence while the model is still writing: each finished
   sentence is sent for speech right away (in parallel), and the clips play back in order.
   One shared player: a new reply, the mic, or a new question stops the current one. */
const player = { stream: null };
function setListenLabel(button, text, icon) {
  if (!button) return;
  button.innerHTML = icon; button.append(el("span", null, text));
}
function stopSpeaking() {
  const s = player.stream;
  player.stream = null;
  if (s) {
    for (const a of [s.audio, ...s.queue]) { if (a) { a.pause(); a.removeAttribute("src"); a.load(); } }
    s.queue = [];
    setListenLabel(s.button, "Listen", ICONS.speaker);
  }
  if ($("status-text").textContent === STATUS.speaking) setStatus(state.busy ? "busy" : "ready");
}
function startSpeech(button = null) {
  stopSpeaking();
  const s = { queue: [], playing: false, closed: false, audio: null, button, pending: "" };
  player.stream = s;
  return s;
}
function attachSpeechButton(s, button) {
  if (player.stream !== s || !button) return;
  s.button = button;
  setListenLabel(button, "Stop", ICONS.stop);
}
function queueSpeech(s, text) {
  if (player.stream !== s || !text.trim()) return;
  // Streamed MP3: the browser starts downloading now (in parallel with earlier sentences)
  // and can start playing at the first bytes instead of waiting for the whole clip.
  const audio = new Audio();
  audio.preload = "auto";
  audio.src = "/api/tts/stream?text=" + encodeURIComponent(text);
  s.queue.push(audio);
  if (!s.playing) playNext(s);
}
async function playNext(s) {
  if (player.stream !== s) return;
  const audio = s.queue.shift();
  if (!audio) {
    s.playing = false;
    if (s.closed) { setListenLabel(s.button, "Listen", ICONS.speaker); player.stream = null; if (!state.busy) setStatus("ready"); }
    return;
  }
  s.playing = true;
  s.audio = audio;
  let moved = false;
  const next = () => { if (!moved) { moved = true; playNext(s); } };
  audio.onended = next;
  audio.onerror = next;  // e.g. 204 = nothing speakable in this piece: skip it
  if (s.button) setListenLabel(s.button, "Stop", ICONS.stop);
  setStatus("speaking");
  try { await audio.play(); }
  catch (e) {
    if (player.stream !== s) return;
    // Autoplay can be blocked until the user has clicked on the page; the Listen button still works.
    if (e.name === "NotAllowedError") stopSpeaking(); else next();
  }
}
// Split off finished sentences from text that is still growing. Short pieces wait for more text;
// a long run without punctuation is cut at a comma or space so speech can start early.
const SENTENCE_END = /(?:[।!?]+|\.(?=\s)|\n)+\s*/g;
function feedSpeech(s, text, final = false) {
  if (player.stream !== s) return;
  s.pending += text;
  let start = 0, m;
  SENTENCE_END.lastIndex = 0;
  while ((m = SENTENCE_END.exec(s.pending))) {
    const end = m.index + m[0].length;
    if (end - start >= 12) { queueSpeech(s, s.pending.slice(start, end)); start = end; }
  }
  s.pending = s.pending.slice(start);
  if (!final && s.pending.length > 160) {
    const cut = Math.max(s.pending.lastIndexOf(", ", 160), s.pending.lastIndexOf("، ", 160));
    const at = cut > 40 ? cut + 2 : s.pending.lastIndexOf(" ", 160) + 1;
    if (at > 40) { queueSpeech(s, s.pending.slice(0, at)); s.pending = s.pending.slice(at); }
  }
  if (final) {
    if (s.pending.trim()) queueSpeech(s, s.pending);
    s.pending = "";
    s.closed = true;
    if (!s.playing && !s.queue.length) playNext(s);
  }
}
// Listen button: same live player, fed the whole answer at once.
function speak(text, button) {
  const s = startSpeech(button);
  setListenLabel(button, "Loading…", ICONS.speaker);
  feedSpeech(s, text, true);
}

// A Salesforce change waiting for the user's decision: show it with Confirm / Cancel buttons.

async function send(text, opts = {}) {
  stopSpeaking();
  state.busy = true; $("send").disabled = true; setStatus("busy");
  addMessage("user", text);
  const msg = addMessage("assistant", "");
  const bubble = msg.querySelector(".bubble");
  // Animated dots plus a live timer until the first words arrive.
  const thinking = el("div", "thinking");
  const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i"));
  dots.setAttribute("role", "status"); dots.setAttribute("aria-label", "Generating answer");
  const elapsed = el("span", "elapsed", "0.0s");
  const step = el("span", "elapsed", "");
  thinking.append(dots, elapsed, step);
  bubble.replaceChildren(thinking);
  const startedAt = performance.now();
  const timer = setInterval(() => (elapsed.textContent = fmtTime(performance.now() - startedAt)), 100);
  scrollDown();
  let answer = "", finished = false, pendingAction = null;
  // Voice question: start speaking the answer while it is still being written.
  let speech = opts.voice ? startSpeech() : null;
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: state.threadId, voice: !!opts.voice }),
    });
    if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(typeof d === "string" ? d : JSON.stringify(d)); }
    const reader = r.body.getReader(), dec = new TextDecoder();

      if (done) break;
      buf += dec.decode(value, { stream: true });

        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "{}");
        if (ev === "meta") {
          state.threadId = data.thread_id;
          history.replaceState(null, "", "#" + data.thread_id);
          setHeader({ thread_id: data.thread_id, title: data.title, total_tokens: 0 });
        } else if (ev === "confirm") {
          pendingAction = data;
        } else if (ev === "redact") {
          // The output guardrail replaced the answer (it would have leaked a key or internal settings).
          answer = data.text; bubble.innerHTML = md(answer);
          if (speech) { stopSpeaking(); speech = startSpeech(); feedSpeech(speech, answer, true); }
        } else if (ev === "tool") {
          step.textContent = "· " + (data.name.startsWith("sf_") ? "Salesforce: " : "") + data.label + "…";
        } else if (ev === "sources") {
          renderSources(msg, data.sources);
        } else if (ev === "token") {
          const stick = $("messages").scrollHeight - $("messages").scrollTop - $("messages").clientHeight < 80;

          answer += data.text; bubble.innerHTML = md(answer);
          if (speech) feedSpeech(speech, data.text);
          if (stick) scrollDown();
        } else if (ev === "done") {
          finished = true;
          bubble.innerHTML = md(data.message.content);
          finishAssistant(msg, data.message);
          if (pendingAction) renderConfirm(msg, pendingAction);
          setHeader(data.thread);
          if (speech) {
            // Speak anything the server added at the end (e.g. a note) and finish the queue.
            const extra = data.message.content.startsWith(answer.trim()) ? data.message.content.slice(answer.trim().length) : "";
            feedSpeech(speech, extra, true);
            attachSpeechButton(speech, msg.listenButton);
          }
        } else if (ev === "error") {
          throw new Error(data.message);
        }
      }
    }

  } catch (e) {
    thinking.remove();
    bubble.append(el("div", "error", "Error: " + e.message));
    if (speech) feedSpeech(speech, "", true);  // speak what already arrived, then stop
  } finally {
    clearInterval(timer);
    bubble.classList.remove("cursor");
    state.busy = false; $("send").disabled = false;
    setStatus(player.stream?.playing ? "speaking" : "ready");
    loadThreads();
    $("input").focus();
  }
}

/* ---------- voice input: speak -> text in the box -> sent automatically ---------- */
const mic = $("mic");
const PLACEHOLDER = input.placeholder;
let recorder = null;
function notice(title, text) { return confirmDialog({ title, text, confirmLabel: "OK", cancelLabel: null, danger: false }); }

// Speech language for the browser's recognizer (Chrome/Edge). Saved per browser.
// "auto": record, then Whisper detects Hindi or English and writes each in its own script.
// The others use the browser's live recognition in one fixed language (text appears while speaking).
const SPEECH_LANGS = [
  { code: "auto", label: "Auto-detect (Hindi + English)" },
  { code: "hi-IN", label: "Hindi (live text)" },
  { code: "en-IN", label: "English India (live text)" },
  { code: "en-US", label: "English US (live text)" },
];
function speechLang() {
  let v = ""; try { v = localStorage.getItem("speechLang") || ""; } catch {}
  return SPEECH_LANGS.some((l) => l.code === v) ? v : "auto";
}
$("mic-device").title = "Speech language";
$("mic-device").setAttribute("aria-label", "Speech language");
$("mic-device").onclick = (e) => {
  e.stopPropagation();
  const current = speechLang();
  openMenu($("mic-device"), $("mic-device"), SPEECH_LANGS.map((l) => ({
    label: l.label, icon: `<span class="check">${l.code === current ? "✓" : ""}</span>`,
    run: () => { try { localStorage.setItem("speechLang", l.code); } catch {} },
  })));

/* Browser speech recognition: text appears live while you speak,
   and the question is sent automatically after a short pause. */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const PAUSE_TO_SEND_MS = 1500;
let dictation = null;

function startDictation() {
  if (state.busy || dictation) return;
  const sr = new SpeechRec();
  sr.lang = speechLang();
  sr.continuous = true;
  sr.interimResults = true;
  sr.maxAlternatives = 1;

  const base = input.value.trim();
  let finalText = "", interimText = "", pauseTimer = null, cancelled = false, failed = false;
  const d = { sr, base, stop: () => { clearTimeout(pauseTimer); try { sr.stop(); } catch {} },
              cancel: () => { cancelled = true; clearTimeout(pauseTimer); try { sr.abort(); } catch {} } };
  dictation = d;

  const show = () => {
    const spoken = (finalText + " " + interimText).replace(/\s+/g, " ").trim();
    input.value = [base, spoken].filter(Boolean).join(" ");
    input.dispatchEvent(new Event("input"));
  };
  sr.onstart = () => {
    mic.classList.add("recording");
    mic.title = "Stop and send";
    input.placeholder = "Listening… speak now";
  };
  sr.onresult = (event) => {
    interimText = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const r = event.results[i];
      if (r.isFinal) finalText += " " + r[0].transcript;
      else interimText += r[0].transcript;
    }
    show();
    // Send once you stop talking for a moment.
    clearTimeout(pauseTimer);
    pauseTimer = setTimeout(() => d.stop(), PAUSE_TO_SEND_MS);
  };
  sr.onerror = (event) => {
    if (event.error === "aborted") return;
    failed = true;
    const messages = {
      "not-allowed": ["Microphone blocked", "Allow microphone access for this page in your browser, then try again."],
      "service-not-allowed": ["Speech recognition unavailable", "This browser blocks its speech service. Use Chrome or Edge, or type your question."],
      "no-speech": ["Didn't catch that", "No speech was heard. Speak a little closer to the microphone and try again."],
      "audio-capture": ["No microphone found", "Check that a microphone is connected and selected in your system sound settings."],
      "network": ["Speech service unreachable", "The browser could not reach its speech service. Check your internet connection and try again."],
      "language-not-supported": ["Language not supported", "Pick a different speech language with the arrow next to the mic."],
    };
    const [title, text] = messages[event.error] || ["Voice input failed", "Error: " + event.error];
    notice(title, text);
  };
  sr.onend = () => {
    clearTimeout(pauseTimer);
    dictation = null;
    mic.classList.remove("recording");
    mic.title = "Speak your question";
    input.placeholder = PLACEHOLDER;
    if (cancelled) return;
    finalText = (finalText + " " + interimText).trim();  // keep words still marked interim
    interimText = "";
    show();
    if (finalText && !failed) submitSpoken();
  };
  try { sr.start(); } catch (e) { dictation = null; notice("Voice input failed", e.message); }
}

/* Fallback for browsers without built-in speech recognition (e.g. Firefox):
   record locally and transcribe on the server with Groq Whisper. */
function rms(analyser, buf) {
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (const v of buf) sum += v * v;
  return Math.sqrt(sum / buf.length);
}

async function startRecording() {
  if (state.busy || recorder) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    return notice("Voice input not available", "This browser does not support recording from the microphone.");
  }
  // Ask the browser to clean the signal: removes fan/AC hum, keyboard noise and speaker echo.
  const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio }); }
  catch (e) { return notice("Microphone blocked", "Allow microphone access for this page in your browser, then try again."); }

  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find((t) => MediaRecorder.isTypeSupported(t));
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];

  // Voice detection that adapts to the room: measure the background noise for the first
  // half second, then only count sound clearly louder than that as speech.
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  const startedAt = performance.now();
  const CALIBRATE_MS = 500, SPEECH_NEEDED_MS = 300, END_SILENCE_MS = 1500, NO_SPEECH_MS = 7000, MAX_MS = 60000;
  let floorSum = 0, floorN = 0, threshold = 0.02;
  let speechMs = 0, heard = false, lastLoud = startedAt, last = startedAt, manual = false;
  const tick = setInterval(() => {
    const now = performance.now(), dt = now - last; last = now;
    const level = rms(analyser, buf);
    const elapsed = now - startedAt;
    if (elapsed < CALIBRATE_MS) {
      floorSum += level; floorN++;
      input.placeholder = "Listening… (calibrating to your room)";
      return;
    }
    if (floorN) { threshold = Math.max(0.012, (floorSum / floorN) * 3); floorN = 0; }
    if (level > threshold) {
      speechMs += dt; lastLoud = now;
      if (speechMs >= SPEECH_NEEDED_MS) heard = true;  // short clicks and bumps don't count
    }
    input.placeholder = heard ? `Listening… ${fmtTime(elapsed)} (click the mic to stop)` : "Listening… start speaking";
    if ((heard && now - lastLoud > END_SILENCE_MS) || (!heard && elapsed > NO_SPEECH_MS) || elapsed > MAX_MS) rec.stop();
  }, 50);

  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    clearInterval(tick);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    recorder = null;
    mic.classList.remove("recording");
    mic.title = "Speak your question";
    if (!heard) {  // only noise or silence: nothing to send
      input.placeholder = PLACEHOLDER;
      if (manual) notice("Didn't catch that", "No speech was detected. Speak a little closer to the microphone and try again.");
      return;
    }
    mic.disabled = true;
    input.placeholder = "Transcribing…";
    try {
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      const ext = blob.type.includes("mp4") ? "mp4" : blob.type.includes("ogg") ? "ogg" : "webm";
      const fd = new FormData();
      fd.append("audio", blob, "speech." + ext);
      const { text } = await api("/api/transcribe", { method: "POST", body: fd });
      if (text) {
        input.value = (input.value.trim() ? input.value.trim() + " " : "") + text;
        input.dispatchEvent(new Event("input"));
        submitSpoken();
      } else {
        notice("Didn't catch that", "The recording only had background noise. Try again, speaking a little closer to the microphone.");
      }
    } catch (e) {
      notice("Could not understand the recording", e.message);
    } finally {
      mic.disabled = false;
      input.placeholder = PLACEHOLDER;
    }
  };
  rec.stopByUser = () => { manual = true; rec.stop(); };
  rec.start();
  recorder = rec;
  mic.classList.add("recording");
  mic.title = "Stop recording";
}
mic.onclick = () => {
  stopSpeaking();  // don't record the assistant's own voice
  if (SpeechRec && speechLang() !== "auto") {
    if (dictation) dictation.stop(); else startDictation();  // click again to stop and send now
  } else if (recorder) {
    if (recorder.state !== "inactive") recorder.stopByUser();
  } else {
    startRecording();
  }
};
// Esc while listening cancels without sending.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && dictation && !document.querySelector(".overlay")) {
    const base = dictation.base;
    dictation.cancel();
    input.value = base; input.dispatchEvent(new Event("input"));
  }
});
// The language menu only applies to the browser recognizer.
// Without browser recognition only auto-detect (Whisper) is possible, so the menu is not needed.
if (!SpeechRec) $("mic-device").hidden = true;

(async function init() {
  loadFiles().catch(() => {});
  const id = location.hash.slice(1);
  if (id) await openThread(id); else newChat();
  try {
    const h = await api("/health");
    if (h.mongo !== "ok") throw new Error("database unavailable");
    const sf = h.salesforce || {};
    $("status").title = `Model: ${h.model} · LangSmith tracing: ${h.langsmith_tracing ? "on (" + h.langsmith_project + ")" : "off, add LANGSMITH_API_KEY to .env"}`
      + ` · Salesforce: ${sf.connected ? "connected via " + sf.auth : "not connected (" + (sf.auth || "not configured") + ")"}`;
  } catch (e) {
    setStatus("offline");
    $("status").title = "Server problem: " + e.message;
  }
})();
</script>
