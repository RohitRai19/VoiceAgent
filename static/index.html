<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with your files</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  // Set the theme before the page paints: saved choice first, otherwise the system setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #1c2129; --muted: #6b7482;
    --accent: #2f6fed; --accent-text: #ffffff; --user: #e8f0fe; --hover: #eef1f5; --danger: #c93a3a;
    --code: #f0f2f5;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #14171d; --border: #262b35; --text: #e6e9ee; --muted: #8f99a8;
    --accent: #5b8dff; --accent-text: #0d1117; --user: #25324a; --hover: #1c2029; --danger: #ef6b6b;
    --code: #1f242d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; }

  aside { width: 290px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 8px 12px; }
  .btn:hover { background: var(--hover); }
  .btn.new { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; font-weight: 600; font-size: 15px; background: var(--hover); border-radius: 12px; padding: 12px 14px; }
  .btn.new:hover { border-color: var(--muted); }
  .btn.new svg { width: 18px; height: 18px; flex: none; }
  .status { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--border); background: var(--hover); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
  .status.busy i { background: #f5a524; animation: pulse 1s ease-in-out infinite; }
  .status.offline i { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }
  .icon-btn { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 22px; height: 22px; }
  .section-title { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 14px 6px; display: flex; justify-content: space-between; align-items: center; }
  .list { overflow-y: auto; padding: 0 8px 8px; }
  #threads { flex: 1 1 55%; min-height: 80px; }
  #files { flex: 0 1 30%; min-height: 60px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--user); }
  .row .label { flex: 1; min-width: 0; }
  .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .x { border: 0; background: none; color: var(--muted); padding: 2px 6px; border-radius: 6px; visibility: hidden; }
  .row:hover .x { visibility: visible; }
  .row .x:hover { color: var(--danger); background: var(--panel); }
  .row .more { font-size: 18px; line-height: 1; letter-spacing: 1px; }
  .row .more:hover { color: var(--text); background: var(--panel); }
  .row.active .more, .row.menu-on .more { visibility: visible; }
  @media (hover: none) { .row .x { visibility: visible; } }
  .row .pin { flex: none; color: var(--muted); display: inline-flex; }
  .row input.rename { width: 100%; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; outline: 0; }
  .menu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px; min-width: 180px; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
  .menu button { display: flex; gap: 12px; align-items: center; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 8px; text-align: left; }
  .menu button:hover { background: var(--hover); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 0; }
  .menu .danger { color: var(--danger); }
  .menu svg, .copy svg, .pin svg { width: 16px; height: 16px; flex: none; }
  .file-row { cursor: default; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 8px; }
  #drop { margin: 0 14px 14px; border: 1.5px dashed var(--border); border-radius: 10px; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #upload-status { font-size: 12px; color: var(--muted); padding: 0 14px 10px; white-space: pre-wrap; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #menu { display: none; }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill.ok { color: #1f9d55; border-color: #1f9d55; }
  .pill.warn { color: #c98a1a; border-color: #c98a1a; }
  #thread-id { font-family: ui-monospace, Consolas, monospace; cursor: pointer; }

  #messages { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin: 0 0 18px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.assistant { flex-direction: row; gap: 12px; align-items: flex-start; }
  .avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; background: #10b981; color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .body { flex: 1; min-width: 0; padding-top: 5px; }
  .thinking { display: flex; align-items: center; gap: 12px; height: 24px; }
  .dots { display: inline-flex; gap: 5px; align-items: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-5px); opacity: 1; } }
  .elapsed { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  .copy { font-size: 13px; border: 1px solid var(--border); background: var(--hover); border-radius: 8px; padding: 4px 10px; display: inline-flex; gap: 7px; align-items: center; }
  .copy:hover { border-color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }
  .bubble { max-width: 100%; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant .bubble > :first-child { margin-top: 0; }
  .msg.assistant .bubble > :last-child { margin-bottom: 0; }
  .bubble pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .bubble code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre code { padding: 0; background: none; }
  .bubble table { border-collapse: collapse; display: block; overflow-x: auto; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  details.sources { margin-top: 8px; font-size: 13px; }
  details.sources summary { cursor: pointer; color: var(--muted); }
  .src { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; background: var(--panel); }
  .src b { font-weight: 600; }
  .src .snip { color: var(--muted); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error { color: var(--danger); }
  .welcome { text-align: center; color: var(--muted); margin-top: 12vh; }
  .welcome h2 { color: var(--text); margin-bottom: 6px; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }

  form { padding: 12px 20px 18px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; padding: 6px 8px; max-height: 180px; }
  #send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 600; }
  #send:disabled { opacity: .5; cursor: default; }

  @media (max-width: 760px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.3); }
    body.menu-open aside { transform: none; }
    #menu { display: inline-block; }
    header, #messages, form { padding-left: 16px; padding-right: 16px; }
    #thread-id { display: none; }
  }
</style>
</head>
<body>
<aside>
  <div class="side-head"><button class="btn new" id="new-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button></div>
  <div class="section-title">Chats</div>
  <div class="list" id="threads"></div>
  <div class="section-title">Your files <span id="file-count"></span></div>
  <div class="list" id="files"></div>
  <div id="upload-status"></div>
  <div id="drop">Drop files here or click to upload<br><small>PDF, DOCX, TXT, MD, CSV, JSON…</small></div>
  <input type="file" id="file-input" multiple hidden>
</aside>

<main>
  <header>
    <button class="btn" id="menu" aria-label="Open menu">☰</button>
    <h1 id="title">New chat</h1>
    <span class="pill" id="thread-id" title="Thread ID (click to copy)" hidden></span>
    <span class="status" id="status" role="status"><i></i><span id="status-text">Ready</span></span>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch between dark and light theme" title="Switch theme"></button>
  </header>
  <div id="messages"><div class="wrap" id="msg-wrap"></div></div>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask something about your files…" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { threadId: null, busy: false };

function md(text) {
  text = text.replace(/【(\d+)[^】]*】/g, "[$1]");
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  const d = document.createElement("div"); d.textContent = text;
  return d.innerHTML.replace(/\n/g, "<br>");
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return r.json();
}
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

/* ---------- threads ---------- */
async function loadThreads() {
  const threads = await api("/api/threads");
  const box = $("threads"); box.replaceChildren();
  if (!threads.length) box.append(el("div", "empty", "No chats yet."));
  for (const t of threads) {
    const row = el("div", "row" + (t.thread_id === state.threadId ? " active" : ""));
    const label = el("div", "label");
    label.append(el("div", "title", t.title), el("div", "sub", `${t.message_count} messages · ${t.total_tokens.toLocaleString()} tokens`));
    if (t.pinned) { const p = el("span", "pin"); p.innerHTML = ICONS.pin; p.title = "Pinned"; row.append(p); }
    const more = el("button", "x more", "⋯"); more.title = "Chat options"; more.setAttribute("aria-label", "Chat options");
    more.onclick = (e) => {
      e.stopPropagation();
      openMenu(more, row, [
        { label: "Rename", icon: ICONS.rename, run: () => startRename(row, t) },
        { label: t.pinned ? "Unpin" : "Pin", icon: ICONS.pin, run: async () => {
            await api("/api/threads/" + t.thread_id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pinned: !t.pinned }) });
            loadThreads();
        } },
        null,
        { label: "Delete", icon: ICONS.trash, danger: true, run: async () => {
            if (!confirm(`Delete chat "${t.title}"? This cannot be undone.`)) return;
            await api("/api/threads/" + t.thread_id, { method: "DELETE" });
            if (t.thread_id === state.threadId) newChat(); else loadThreads();
        } },
      ]);
    };
    row.append(label, more);
    row.onclick = () => openThread(t.thread_id);
    box.append(row);
  }
}
function startRename(row, t) {
  const input = document.createElement("input");
  input.className = "rename"; input.value = t.title; input.maxLength = 80;
  row.querySelector(".title").replaceWith(input);
  input.onclick = (e) => e.stopPropagation();
  input.focus(); input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const title = input.value.trim();
    if (save && title && title !== t.title) {
      try {
        await api("/api/threads/" + t.thread_id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
        if (t.thread_id === state.threadId) $("title").textContent = title;
      } catch (e) { alert("Could not rename: " + e.message); }
    }
    loadThreads();
  };
  input.onkeydown = (e) => { if (e.key === "Enter") finish(true); else if (e.key === "Escape") finish(false); };
  input.onblur = () => finish(true);
}

/* ---------- popup menu ---------- */
const ICONS = {
  rename: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 4H7l3-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
};
let closeMenu = () => {};
function openMenu(anchor, row, items) {
  closeMenu();
  const menu = el("div", "menu"); menu.setAttribute("role", "menu");
  for (const it of items) {
    if (!it) { menu.append(document.createElement("hr")); continue; }
    const b = el("button", it.danger ? "danger" : null); b.setAttribute("role", "menuitem");
    b.innerHTML = it.icon; b.append(el("span", null, it.label));
    b.onclick = (e) => { e.stopPropagation(); closeMenu(); it.run(); };
    menu.append(b);
  }
  document.body.append(menu);
  row.classList.add("menu-on");
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
  menu.style.top = (r.bottom + 6 + menu.offsetHeight > innerHeight ? r.top - menu.offsetHeight - 6 : r.bottom + 6) + "px";
  const onDown = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  const onKey = (e) => { if (e.key === "Escape") closeMenu(); };
  closeMenu = () => {
    menu.remove(); row.classList.remove("menu-on");
    document.removeEventListener("mousedown", onDown, true); document.removeEventListener("keydown", onKey);
    $("threads").removeEventListener("scroll", closeMenu);
    closeMenu = () => {};
  };
  document.addEventListener("mousedown", onDown, true); document.addEventListener("keydown", onKey);
  $("threads").addEventListener("scroll", closeMenu);
}
function setHeader(thread) {
  $("title").textContent = thread ? thread.title : "New chat";
  const idPill = $("thread-id");
  idPill.hidden = !thread;
  if (thread) {
    idPill.textContent = "thread " + thread.thread_id.slice(0, 8);
    idPill.dataset.full = thread.thread_id;
    idPill.title = `Thread ID (click to copy) · ${(thread.total_tokens || 0).toLocaleString()} tokens used in this chat`;
  }
}
const STATUS = { ready: "Ready", busy: "Thinking…", offline: "Offline" };
function setStatus(kind) {
  $("status").className = "status" + (kind === "ready" ? "" : " " + kind);
  $("status-text").textContent = STATUS[kind];
}
const THEME_ICONS = {
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};
function applyTheme(theme, save) {
  document.documentElement.dataset.theme = theme;
  $("theme").innerHTML = THEME_ICONS[theme];
  if (save) { try { localStorage.setItem("theme", theme); } catch {} }
}
function newChat() {
  if (state.busy) return;
  state.threadId = null;
  history.replaceState(null, "", location.pathname);
  setHeader(null);
  const w = $("msg-wrap"); w.replaceChildren();
  const welcome = el("div", "welcome");
  welcome.append(el("h2", null, "Chat with your files"), el("div", null, "Upload files on the left, then ask a question. Answers come only from your files."));
  w.append(welcome);
  loadThreads();
  document.body.classList.remove("menu-open");
  $("input").focus();
}
async function openThread(id) {
  if (state.busy) return;
  try {
    const t = await api("/api/threads/" + id);
    state.threadId = id;
    history.replaceState(null, "", "#" + id);
    setHeader(t);
    $("msg-wrap").replaceChildren();
    for (const m of t.messages) {
      const node = addMessage(m.role, m.content);
      if (m.role === "assistant") finishAssistant(node, m);
    }
    scrollDown();
    loadThreads();
    document.body.classList.remove("menu-open");
  } catch (e) { newChat(); }
}

/* ---------- messages ---------- */
function addMessage(role, text) {
  const w = $("msg-wrap");
  w.querySelector(".welcome")?.remove();
  const msg = el("div", "msg " + role);
  const bubble = el("div", "bubble");
  if (role === "user") {
    bubble.textContent = text;
    msg.append(bubble);
  } else {
    bubble.innerHTML = md(text || "");
    const body = el("div", "body");
    body.append(bubble);
    msg.append(el("div", "avatar", "AI"), body);
  }
  w.append(msg);
  return msg;
}
function fmtTime(ms) { return ms < 60000 ? (ms / 1000).toFixed(1) + "s" : Math.floor(ms / 60000) + "m " + Math.round((ms % 60000) / 1000) + "s"; }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove(); return ok;
}
function renderSources(msgEl, sources) {
  const msg = msgEl.querySelector(".body") || msgEl;
  msg.querySelector("details.sources")?.remove();
  if (!sources || !sources.length) return;
  const d = el("details", "sources");
  d.append(el("summary", null, `${sources.length} source${sources.length > 1 ? "s" : ""} from your files`));
  for (const s of sources) {
    const box = el("div", "src");
    const head = el("div");
    head.append(el("b", null, `[${s.n}] ${s.source}`), document.createTextNode((s.page ? ` · page ${s.page}` : "") + (s.section ? ` · ${s.section}` : "") + (s.match === "semantic" && s.score != null ? ` · match ${(s.score * 100).toFixed(0)}%` : s.match ? ` · ${s.match}` : "")));
    box.append(head, el("div", "snip", s.snippet + (s.snippet.length >= 400 ? "…" : "")));
    d.append(box);
  }
  msg.append(d);
}
function finishAssistant(msgEl, m) {
  renderSources(msgEl, m.sources);
  const msg = msgEl.querySelector(".body") || msgEl;
  msg.querySelector(".meta")?.remove();
  msg.querySelector(".actions")?.remove();
  const actions = el("div", "actions");
  const copy = el("button", "copy"); copy.type = "button";
  copy.innerHTML = ICONS.copy; const copyLabel = el("span", null, "Copy"); copy.append(copyLabel);
  copy.onclick = async () => {
    copyLabel.textContent = (await copyText(m.content)) ? "Copied" : "Copy failed";
    setTimeout(() => (copyLabel.textContent = "Copy"), 1200);
  };
  actions.append(copy);
  msg.append(actions);
  const meta = el("div", "meta");
  const u = m.usage || {};
  if (m.duration_ms != null) { const d = el("span", null, "answered in " + fmtTime(m.duration_ms)); d.title = "Processing time for this answer"; meta.append(d); }
  if (u.total_tokens) meta.append(el("span", null, `${u.total_tokens.toLocaleString()} tokens (${u.input_tokens.toLocaleString()} in · ${u.output_tokens.toLocaleString()} out)`));
  if (m.run_id) { const r = el("span", null, "trace " + m.run_id.slice(0, 8)); r.title = "LangSmith run ID: " + m.run_id; meta.append(r); }
  if (meta.children.length) msg.append(meta);
}

async function send(text) {
  state.busy = true; $("send").disabled = true; setStatus("busy");
  addMessage("user", text);
  const msg = addMessage("assistant", "");
  const bubble = msg.querySelector(".bubble");
  // Animated dots plus a live timer until the first words arrive.
  const thinking = el("div", "thinking");
  const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i"));
  dots.setAttribute("role", "status"); dots.setAttribute("aria-label", "Generating answer");
  const elapsed = el("span", "elapsed", "0.0s");
  thinking.append(dots, elapsed);
  bubble.replaceChildren(thinking);
  const startedAt = performance.now();
  const timer = setInterval(() => (elapsed.textContent = fmtTime(performance.now() - startedAt)), 100);
  scrollDown();
  let answer = "", finished = false;
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: state.threadId }),
    });
    if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(typeof d === "string" ? d : JSON.stringify(d)); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "{}");
        if (ev === "meta") {
          state.threadId = data.thread_id;
          history.replaceState(null, "", "#" + data.thread_id);
          setHeader({ thread_id: data.thread_id, title: data.title, total_tokens: 0 });
        } else if (ev === "sources") {
          renderSources(msg, data.sources);
        } else if (ev === "token") {
          const stick = $("messages").scrollHeight - $("messages").scrollTop - $("messages").clientHeight < 80;
          if (!answer) { clearInterval(timer); bubble.classList.add("cursor"); }
          answer += data.text; bubble.innerHTML = md(answer);
          if (stick) scrollDown();
        } else if (ev === "done") {
          finished = true;
          bubble.innerHTML = md(data.message.content);
          finishAssistant(msg, data.message);
          setHeader(data.thread);
        } else if (ev === "error") {
          throw new Error(data.message);
        }
      }
    }
    if (!finished) throw new Error("The connection closed before the answer finished.");
  } catch (e) {
    thinking.remove();
    bubble.append(el("div", "error", "Error: " + e.message));
  } finally {
    clearInterval(timer);
    bubble.classList.remove("cursor");
    state.busy = false; $("send").disabled = false; setStatus("ready");
    loadThreads();
    $("input").focus();
  }
}

/* ---------- files ---------- */
async function loadFiles() {
  const files = await api("/api/files");
  const box = $("files"); box.replaceChildren();
  $("file-count").textContent = files.length ? files.length : "";
  if (!files.length) box.append(el("div", "empty", "No files yet. Upload one to start."));
  for (const f of files) {
    const row = el("div", "row file-row");
    const label = el("div", "label");
    const t = el("div", "title", f.name); t.title = f.name;
    label.append(t, el("div", "sub", `${fmtSize(f.size)} · ${f.chunks} chunks`));
    const x = el("button", "x", "✕"); x.title = "Remove file";
    x.onclick = async () => {
      if (!confirm(`Remove "${f.name}" from the knowledge base?`)) return;
      await api("/api/files/" + f.file_id, { method: "DELETE" });
      loadFiles();
    };
    row.append(label, x);
    box.append(row);
  }
}
async function upload(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const status = $("upload-status");
  status.textContent = `Indexing ${files.length} file${files.length > 1 ? "s" : ""}… (the first upload also downloads the embedding model, which can take a few minutes)`;
  const fd = new FormData();
  files.forEach((f) => fd.append("files", f));
  try {
    const res = await api("/api/files", { method: "POST", body: fd });
    const failed = res.filter((r) => !r.ok);
    status.textContent = failed.length ? failed.map((r) => `✕ ${r.name}: ${r.error}`).join("\n") : "";
  } catch (e) { status.textContent = "Upload failed: " + e.message; }
  $("file-input").value = "";
  loadFiles();
}

/* ---------- wiring ---------- */
$("new-chat").onclick = newChat;
applyTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light", false);
$("theme").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
$("menu").onclick = () => document.body.classList.toggle("menu-open");
$("messages").onclick = () => document.body.classList.remove("menu-open");
$("thread-id").onclick = (e) => {
  navigator.clipboard?.writeText(e.target.dataset.full);
  const old = e.target.textContent; e.target.textContent = "copied"; setTimeout(() => (e.target.textContent = old), 900);
};
$("drop").onclick = () => $("file-input").click();
$("file-input").onchange = (e) => upload(e.target.files);
const drop = $("drop");
["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files));

const input = $("input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || state.busy) return;
  input.value = ""; input.style.height = "auto";
  send(text);
});

(async function init() {
  loadFiles().catch(() => {});
  const id = location.hash.slice(1);
  if (id) await openThread(id); else newChat();
  try {
    const h = await api("/health");
    if (h.mongo !== "ok") throw new Error("database unavailable");
    $("status").title = `Model: ${h.model} · LangSmith tracing: ${h.langsmith_tracing ? "on (" + h.langsmith_project + ")" : "off, add LANGSMITH_API_KEY to .env"}`;
  } catch (e) {
    setStatus("offline");
    $("status").title = "Server problem: " + e.message;
  }
})();
</script>
